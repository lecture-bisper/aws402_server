<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전화번호 등록</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
    .mt-6 {
        margin-top: 5em;
    }
  </style>

  <script>
    window.addEventListener('DOMContentLoaded', function() {

        const btnCancel = document.querySelector('#btn-cancel');
        btnCancel.addEventListener('click', function() {

            history.back();
        });
    });
  </script>
</head>
<body>

<header>
  <nav th:replace="~{/layout/header :: navigator}"></nav>
  <div th:replace="~{/layout/header :: jumbotron('등록')}"></div>
</header>

<main class="container mt-5">
  <section>
    <div class="row">
      <div class="col-sm-6 mx-auto">
        <form action="/phonebook/insert" method="post">
          <div>
            <label for="name" class="form-label">이름 : </label>
            <input type="text" class="form-control" id="name" name="name" placeholder="이름을 입력하세요">
          </div>
          <div class="mt-3">
            <label for="phone" class="form-label">휴대폰 : </label>
            <input type="text" class="form-control" id="phone" name="phone" placeholder="휴대폰 번호를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="tel" class="form-label">전화번호 : </label>
            <input type="text" class="form-control" id="tel" name="tel" placeholder="전화번호를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="email" class="form-label">이메일 : </label>
            <input type="email" class="form-control" id="email" name="email" placeholder="이메일을 입력하세요">
          </div>
          <div class="mt-3">
            <label for="address" class="form-label">주소 : </label>
            <input type="text" class="form-control" id="address" name="address" placeholder="주소를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="memo" class="form-label">메모 : </label>
            <textarea class="form-control" id="memo" name="memo" rows="5"></textarea>
          </div>
          <div class="mt-3 row">
            <div class="col-sm d-grid gap-2">
              <button type="submit" class="btn btn-primary">등록</button>
            </div>
            <div class="col-sm d-grid gap-2">
              <button type="reset" class="btn btn-secondary" id="btn-cancel">취소</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{/layout/footer :: footer}"></footer>

</body>
</html>
