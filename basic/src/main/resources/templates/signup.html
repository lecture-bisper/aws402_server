<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

  <div class="container mt-5">
    <h1>회원가입</h1>
    <div class="row">
      <div class="col-sm-6 mx-auto">
        <form action="signupProcess" method="POST">
          <div class="mt-3">
            <label for="user-id" class="form-label">ID : </label>
            <input type="text" class="form-control" id="user-id" name="userId" placeholder="사용자 ID를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="user-pw" class="form-label">PASSWORD : </label>
            <input type="password" class="form-control" id="user-pw" name="userPw" placeholder="비밀번호를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="user-name" class="form-label">Name : </label>
            <input type="text" class="form-control" id="user-name" name="userName" placeholder="사용자 이름을 입력하세요">
          </div>
          <div class="mt-3">
            <label for="user-email" class="form-label">Email :</label>
            <input type="email" class="form-control" id="user-email" name="userEmail" placeholder="사용자 이메일을 입력하세요">
          </div>
          <div class="mt-3">
            <label for="user-phone" class="form-label">Phone :</label>
            <input type="text" class="form-control" id="user-phone" name="userPhone" placeholder="사용자 전화번호를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="user-addr" class="form-label">Address :</label>
            <input type="text" class="form-control" id="user-addr" name="userAddr" placeholder="주소를 입력하세요">
          </div>
          <div class="mt-3 d-grid gap-2">
            <button type="submit" class="btn btn-primary">회원가입</button>
            <button type="reset" class="btn btn-secondary">취소</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
