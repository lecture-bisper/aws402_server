<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<div class="container mt-5">
<!--  form 태그의 action 은 사용자 입력 데이터를 전달할 위치를 지정하는 속성 -->
<!--  method 는 form 태그가 저장하고 있는 데이터 전달 시 데이터를 전달하는 방식을 설정, GET/POST -->
<!--  GET : 사용자가 입력한 데이터를 웹브라우저의 주소창으로 함께 전달, 외부로 노출됨, 중요 정보를 GET 을 사용하면 안됨 -->
<!--  POST : 사용자가 입력한 데이터를 암호화되어 전달, 외부에 노출되지 않음, 중요 정보 전달 시 사용 -->
  <form action="/result" method="GET">
    <div class="mt-3">
      <label for="num1" class="form-label">숫자 1 :</label>
<!--      input 태그에 저장된 사용자 입력 데이터는 form 태그에 포함되어 있을 경우에만 서버로 전송됨 -->
<!--      input 태그의 name 속성은 form 태그의 submit 이벤트가 발생했을 경우 input 태그가 저장하고 있는 사용자 입력 정보를 서버로 전달 시 변수 이름으로 사용됨 -->
      <input type="text" class="form-control" id="num1" name="num" placeholder="첫번째 숫자를 입력하세요">
    </div>
    <div class="mt-3">
      <label for="num2" class="form-label">숫자 2 : </label>
      <input type="text" class="form-control" id="num2" name="num2" placeholder="두번째 숫자를 입력하세요">
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">확인</button>
    </div>
  </form>
</div>

</body>
</html>
