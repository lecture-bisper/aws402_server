<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/css/myStyle.css" th:href="@{/css/myStyle.css}">

  <style>
  </style>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
        const btnCancel = document.querySelector("#btn-cancel");
        btnCancel.addEventListener('click', function () {
            const confirmed = confirm("회원가입을 취소하시겠습니까?");

            if (confirmed) {
                history.back();
            }
        });
    });
  </script>
</head>
<body>

<header>
  <nav th:replace="~{/layout/header :: navigator}"></nav>
  <div th:replace="~{/layout/header :: jumbotron('회원 가입')}"></div>
</header>

<main class="container mt-5">
  <section>
    <div class="row">
      <div class="col-sm-6 mx-auto">
        <form action="/auth/signup" method="post">
          <div>
            <div class="form-floating">
              <input type="text" class="form-control" id="member-id" name="memberId" placeholder="Member ID">
              <label for="member-id">Member ID</label>
            </div>
            <div class="form-floating mt-3">
              <input type="password" class="form-control" id="member-pw" name="memberPw" placeholder="Member Password">
              <label for="member-pw">Member Password</label>
            </div>
            <div class="form-floating mt-3">
              <input type="text" class="form-control" id="member-name" name="memberName" placeholder="Member Name">
              <label for="member-name">Member Name</label>
            </div>
            <div class="form-floating mt-3">
              <input type="email" class="form-control" id="member-email" name="memberEmail" placeholder="Member Email">
              <label for="member-email">Member Email</label>
            </div>
            <div class="form-floating mt-3">
              <input type="text" class="form-control" id="member-phone" name="memberPhone" placeholder="Member Phone">
              <label for="member-phone">Member Phone</label>
            </div>
            <div class="form-floating mt-3">
              <input type="text" class="form-control" id="member-address" name="memberAddress" placeholder="Member Address">
              <label for="member-address">Member Address</label>
            </div>
            <hr>
            <div class="mt-3 d-grid gap-2">
              <button type="submit" class="btn btn-primary">회원가입</button>
              <button type="reset" class="btn btn-secondary" id="btn-cancel">취소</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{/layout/footer :: footer}"></footer>

</body>
</html>
