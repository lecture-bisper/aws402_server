<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/css/myStyle.css" th:href="@{/css/myStyle.css}">

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<header>
  <nav th:replace="~{/layout/header :: navigator}"></nav>
  <div th:replace="~{/layout/header :: jumbotron('로그인')}"></div>
</header>

<main class="container mt-5">
  <section>
    <div class="row">
      <div class="col-sm-4 mx-auto">
        <form action="/auth/signin" method="post">
          <div class="border border-primary rounded-3 p-3">
            <div class="form-floating">
              <input type="text" class="form-control" id="user-id" name="userId" placeholder="User ID">
              <label for="user-id">User ID</label>
            </div>
            <div class="form-floating mt-3">
              <input type="password" class="form-control" id="user-pw" name="userPw" placeholder="User Password">
              <label for="user-pw">User PW</label>
            </div>
            <hr class="mt-3">
            <div class="mt-3 d-grid gap-2">
              <button type="submit" class="btn btn-outline-primary">로그인</button>
              <a href="/auth/signup" class="btn btn-outline-secondary" th:href="@{/auth/signup}">회원가입</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{/layout/footer :: footer}"></footer>

</body>
</html>
