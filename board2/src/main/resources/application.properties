spring.application.name=board2
#   서버 포트 설정
server.port=8080

#   데이터베이스 연결
#   현재 스프링부트의 데이터베이스 커넥션 풀 라이브러리가 hikariCP 임
#   설정 옵션 사용 시 hikari 부분이 없어도 됨
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=aws402
spring.datasource.password=aws402!@#$

#   hikari CP 전용 옵션에는 hikari 를 붙여야 함
spring.datasource.hikari.connection-test-query=SELECT 1

#   mybatis 의 sql 쿼리를 저장하는 xml 파일 위치를 지정
mybatis.mapper-locations=classpath:sql/**/sql-*.xml
#   데이터베이스의 스네이크 명명법을 자바의 카멜명명법 방식으로 자동 변환
mybatis.configuration.map-underscore-to-camel-case=true
#   데이터베이스의 null 을 어떻게 처리할지 설정
mybatis.configuration.jdbc-type-for-null=NULL

mybatis.type-aliases-package=bitc.aws402.board2.dto

#   thymeleaf 설정
#   thymeleaf 캐시 설정 사용 중지
spring.thymeleaf.cache=false
#   템플릿 파일 위치 지정, 기본값 : classpath:/templates/
spring.thymeleaf.prefix=classpath:/templates/
#   템플릿 파일 확장자 명 설정, 기본값 : .html
spring.thymeleaf.suffix=.html
#   기본 문자셋 설정
spring.thymeleaf.encoding=UTF-8

#   정적 리소스에 대한 인코딩(js, css, 미디어파일)
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true


#   파일 업로드 설정
#   파일 업로드 폴더 설정(프로젝트 루트 기준의 상대경로)
file.upload-dir=upload

#   파일 1개당 최대 크기 설정, 기본값 1MB
spring.servlet.multipart.max-file-size=1MB
#   하나의 요청에 포함된 첨부 파일의 최대 크기 설정, 기본값 10MB
spring.servlet.multipart.max-request-size=10MB

