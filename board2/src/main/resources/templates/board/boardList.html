<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<header>

</header>

<main class="container mt-5">
  <section>
    <div class="row">
      <div class="col-sm">
        <table class="table table-hover table-striped text-center">
          <thead>
          <tr>
            <th>글번호</th>
            <th>제목</th>
            <th>작성자</th>
            <th>등록시간</th>
            <th>조회수</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.size(boardList) > 0}" th:each="board : ${boardList}">
            <td th:text="${board.boardIdx}">글번호</td>
            <td class="text-start">
              <a href="#" class="text-decoration-none" th:href="@{/board/boardDetail(boardIdx=${board.boardIdx})}" th:text="${board.boardTitle}"></a>
            </td>
            <td th:text="${board.boardCreateId}">작성자</td>
            <td th:text="${board.boardCreateDate}">등록시간</td>
            <td th:text="${board.boardHitCnt}">조회수</td>
          </tr>
          <tr th:unless="${#lists.size(boardList) > 0}">
            <td colspan="5">조회된 내용이 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="row">
      <div class="col-sm d-flex justify-content-end">
        <a href="/board/boardWrite" class="btn btn-primary">글쓰기</a>
      </div>
    </div>
  </section>
</main>

<footer>

</footer>

</body>
</html>
