<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<main class="container mt-5">
  <section>
    <div class="row">
      <div class="col-sm-6 mx-auto">
<!--        일반 form 데이터는 enctype 의 값이 application/x-www-form-urlencoded 이 기본값임 -->
<!--        form 에 첨부 파일을 추가하려면 enctype 의 값이 multipart/form-data 이어야 함 -->
<!--        multipart/form-data 이어야 일반 form 데이터와 multipart 데이터 2가지가 서버로 전달됨 -->
        <form action="/board/insertBoard" method="post" enctype="multipart/form-data">
          <div class="mt-3">
            <label for="title" class="form-label">제목 : </label>
            <input type="text" class="form-control" id="title" name="boardTitle" placeholder="제목을 입력하세요">
          </div>
          <div class="mt-3">
            <label for="user-id" class="form-label">사용자 ID :</label>
            <input type="text" class="form-control" id="user-id" name="boardCreateId" placeholder="사용자 ID 를 입력하세요">
          </div>
          <div class="mt-3">
            <label for="contents" class="form-label">내용 :</label>
            <textarea class="form-control" id="contents" name="boardContents" rows="10" placeholder="글 내용을 입력하세요"></textarea>
          </div>
          <div class="mt-3">
            <label for="files" class="form-label">첨부파일 : </label>
            <input type="file" class="form-control-file" id="files" name="files" multiple>
          </div>
          <div class="mt-3 d-flex justify-content-around ">
            <button type="submit" class="btn btn-primary flex-fill me-2">확인</button>
            <button type="reset" class="btn btn-secondary flex-fill">취소</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

</body>
</html>
