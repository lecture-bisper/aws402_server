<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thymeleaf 사용하기 4</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<div class="container mt-5">
  <h3>조건문 사용하기</h3>

  <div class="mt-3">
    <h4>삼항 연산자 사용하기</h4>
<!--    자바의 삼항 연산자와 동일한 형태로 사용 -->
<!--    '조건식 ? 참일 경우 실행 : 거짓일 경우 실행' 방식으로 사용함 -->
<!--    참일 경우 혹은 거짓일 경우에만 화면에 출력하도록 하는 것이 가능함 -->
<!--    변수에 저장된 데이터가 null 일 경우에만 출력하기도 가능함 -->
<!--    참만 화면에 출력하고자할 경우 ' : ' 생략 가능 -->
<!--    거짓만 화면에 출력하고자 할 경우 ' ?: ' 형태로 사용 가능함 (?: 사이에 공백이 없어야 함) -->

    <div>
      <p>(10 % 2 == 0) ? 짝수 : 홀수 => <span th:text="(10 % 2 == 0) ? '짝수' : '홀수'"></span></p>
      <p>num = <span th:text="${num % 2 == 0} ? '짝수' : '홀수'"></span></p>
      <div>
<!--        결과가 참일 경우에만 화면에 출력 -->
        <p th:utext="${nullData} ? '<button class=\'btn btn-primary\'>null이 아니면 출력</button>'"></p>
      </div>
      <div>
<!--        결과가 거짓일 경우에만 화면에 출력 -->
        <p th:utext="${nullData} ?: '<button class=\'btn btn-primary\'>null이면 출력</button>'"></p>
      </div>
    </div>
  </div>
</div>


</body>
</html>
