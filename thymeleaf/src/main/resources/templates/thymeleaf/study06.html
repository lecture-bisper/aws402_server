<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<div class="container mt-5">
  <h3>외부 파일 가져오기</h3>
<!--  thymeleaf 에서는 하나의 템플릿 파일에서 페이지의 모든 내용을 출력하지 않음 -->
<!--  자주 사용되는 부분을 따로 분리해서 생성해 놓고, 필요 시 해당 파일을 호출하여 하나의 파일로 합쳐서 사용 -->
<!--  fragment : thymeleaf 를 사용하여 미리 생성해 놓은 파일 혹은 파일의 일부분을 현재 파일로 포함시켜 사용하는 방법 -->
<!--  th:fragment 를 사용하여 thymeleaf 에서 특정 파일 내부로 파함될 영역을 지정함 -->
<!--  fragment 는 하나의 layout 파일에서 여러개를 설정할 수 있음 -->
<!--  fragment 는 매개변수를 전달할 수 있음 -->
<!--  매개변수를 전달할 경우 fragment 이름 설정 시 '이름(변수명1, 변수명2, ...)' 형태로 사용 -->

<!--  th:insert - fragment 로 지정된 파일 및 영역을 현재 파일의 지정한 영역의 자식 태그로 포함 -->
<!--  th:replace - fragment 로 지정된 파일 및 영역을 현재 파일의 지정한 영역으로 대체함 -->
<!--  th:include - fragment 로 지정된 파일 및 영역의 자식 태그를 현재 파일의 지정된 영역의 자식 태그로 포함 -->

<!--  th:가져올방식="~{경로 및 파일명 :: fragment명}" 형태로 사용 -->

  <div>
    <h4>하나의 html 파일에 header, main, footer 영역을 직접 입력한 형태</h4>

    <div style="height: 500px;" class="p-4 border bg-primary-subtle">
      <header class="container-fluid p-4">
        <h1 class="text-center">Header 영역</h1>
      </header>
      <main class="container mt-4 border-top border-2 border-dark">
        <div class="py-4">
          <h1 class="text-center">Main 영역</h1>
        </div>
      </main>
      <footer class="mt-4 border-top border-2 border-dark">
        <div class="py-4">
          <h1 class="text-center">Footer 영역</h1>
        </div>
      </footer>
    </div>
  </div>

  <br><hr><br>

  <div>
    <h4>fragment 로 기존에 생성한 파일의 내용 가져오기</h4>

    <div style="height: 500px" class="p-4 border bg-info-subtle">
      <header th:replace="~{/layout/header :: headerBasic}"></header>
      <main class="container mt-4 border-top border-2 border-dark">
        <div class="py-4">
          <h1 class="text-center">Main 영역</h1>
        </div>
      </main>
      <footer th:replace="~{/layout/footer :: footer}"></footer>
    </div>
  </div>

  <br><hr><br>

  <div>
    <h4>th:insert, th:replace, th:include 에 따른 가져오기 방식</h4>
    <div style="height: 500px" class="p-4 border bg-success-subtle">
      <h5>th:insert</h5>
      <div th:insert="~{/layout/header :: headerBasic}"></div>

      <h5>th:replace</h5>
      <div th:replace="~{/layout/header :: headerBasic}"></div>

      <h5>th:include</h5>
      <div th:include="~{/layout/header :: headerBasic}"></div>
    </div>
  </div>

  <br><hr><br>

  <div>
    <h4>여러가지 영역을 필요에 따라 가져오기</h4>

    <div style="height: 500px" class="p-4 border bg-warning-subtle">
      <div th:replace="~{/layout/header :: headerBasic}"></div>
      <div th:replace="~{/layout/header :: headerNavbar}"></div>
      <div th:replace="~{/layout/header :: headerParam('헤더영역', '소제목을 입력하는 부분')}"></div>
    </div>
  </div>

</div>


<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
