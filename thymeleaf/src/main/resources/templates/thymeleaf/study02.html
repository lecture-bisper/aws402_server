<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thymeleaf 사용하기 2</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <style>
  </style>

  <script>
  </script>
</head>
<body>

<div class="container mt-5">
  <div class="mt-3">
    <h3>선택 변수 출력하기</h3>
    <!--    *{변수명} : thymeleaf 에서 변수를 출력하는 ${변수}와 같은 기능을 함 -->
    <!--    ${변수명} 은 일반 변수 출력 시 ${변수명} 형태로 사용하고, List 나 객체 타입의 변수를 출력 시 ${객체명.필드명} 방식으로 사용해야 함 -->
    <!--    *{변수명} 을 사용하면 '${객체명.필드명}' 형태로 사용하는 것을 *{필드명} 으로 사용 가능 -->
    <!--    사용법 : 부모 태그에 th:object 속성을 사용하여 출력하고자 하는 객체를 값으로 출력 -->
    <!--             자식 태그에 th:text 에서 *{필드명} 형태로 사용 -->

    <div>
      <div>
        <h4>일반적인 ${} 형태로 사용</h4>
        <p th:text="${member.id}">사용자 정보</p>
        <p th:text="${member.name}">사용자 정보</p>
        <p th:text="${member.pass}">사용자 정보</p>
        <p th:text="${member.regiDate}">사용자 정보</p>
      </div>
      <br>
      <div th:object="${member}">
        <h4>선택 변수 방식 사용, *{} 사용</h4>
        <p th:text="*{id}">사용자 정보</p>
        <p th:text="*{name}">사용자 정보</p>
        <p th:text="*{pass}">사용자 정보</p>
        <p th:text="*{regiDate}">사용자 정보</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
