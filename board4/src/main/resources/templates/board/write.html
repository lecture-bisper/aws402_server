<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/css/myStyle.css" th:href="@{/css/myStyle.css}">

  <style>
  </style>

  <script>
    window.addEventListener('DOMContentLoaded', function(){
        const frm = document.querySelector('#frm');
        frm.addEventListener('reset', function(){
            history.back();
        });
    });
  </script>
</head>
<body>


<header>
  <nav th:replace="~{/layout/header :: navigator}"></nav>
  <div th:replace="~{/layout/header :: jumbotron('글등록')}"></div>
</header>

<main class="container mt-5">
  <section>
    <div class="row">
      <div class="col-sm-6 mx-auto">
        <form id="frm" action="/board/write" method="post">
          <div>
            <div class="form-floating">
              <input type="text" class="form-control" id="title" name="boardTitle" placeholder="Title">
              <label for="title">Title</label>
            </div>
            <div class="form-floating mt-3">
              <input type="text" class="form-control" id="create-id" name="boardCreateId" placeholder="Create ID">
              <label for="create-id">Create ID</label>
            </div>
            <div class="form-floating mt-3">
              <textarea class="form-control" id="contents" name="boardContents" rows="5" placeholder="Contents"></textarea>
              <label for="contents">Contents</label>
            </div>
            <div class="row mt-3">
              <div class="col-sm d-grid gap-2">
                <button type="submit" class="btn btn-primary">등록</button>
              </div>
              <div class="col-sm d-grid gap-2">
                <button type="reset" class="btn btn-secondary">취소</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{/layout/footer :: footer}"></footer>


</body>
</html>
